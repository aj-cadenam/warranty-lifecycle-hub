[project]
name = "datecsa-garantias"
version = "0.1.0"
description = "POC backend para gestión de garantías de equipos Datecsa — arquitectura hexagonal con agente IA"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "dj-database-url>=3.1.2",
    "django>=6.0.4",
    "fastapi>=0.136.1",
    "google-genai>=1.74.0",
    "google-generativeai>=0.8.6",
    "langfuse>=4.5.1",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "pydantic[email]>=2.13.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "reportlab>=4.5.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
